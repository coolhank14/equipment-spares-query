const val=(o,...keys)=>{for(const k of keys){if(o[k]!==undefined&&String(o[k]).trim()!=='')return String(o[k]).trim()}return ''};
const num=v=>{const n=Number(String(v??'').replace(/,/g,''));return String(v??'').trim()!==''&&Number.isFinite(n)?n:null};
const stock=i=>num(val(i,'備品數量','數量'));
const safe=i=>num(val(i,'安全數量'));
function status(i){const s=stock(i),m=safe(i);if(s===null||m===null)return 'unknown';if(s===0)return 'zero';if(s<m)return 'low';return 'ok'}
function order(i){const s=stock(i),m=safe(i);if(s===null||m===null)return null;return Math.max(0,m-s)}
function fmt(n){return n===null||n===undefined?'—':n.toLocaleString('zh-TW')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const categories=[...new Set(ITEMS.map(i=>i['分類']).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-Hant'));
const cat=document.querySelector('#category');categories.forEach(c=>cat.add(new Option(c,c)));
function text(i){return Object.values(i).map(v=>typeof v==='object'?JSON.stringify(v):String(v??'')).join(' ').toLowerCase()}
function render(){
 const q=document.querySelector('#q').value.trim().toLowerCase(),c=cat.value,st=document.querySelector('#stockFilter').value,buy=document.querySelector('#onlyBuy').checked;
 const filtered=ITEMS.filter(i=>(!c||i['分類']===c)&&(!q||text(i).toLowerCase().includes(q))&& (st==='all'||status(i)===st)&&(!buy||(order(i)!==null&&order(i)>0)));
 document.querySelector('#count').textContent=`顯示 ${filtered.length.toLocaleString('zh-TW')} / ${ITEMS.length.toLocaleString('zh-TW')} 筆`;
 const tbody=document.querySelector('#rows');
 if(!filtered.length){tbody.innerHTML='<tr><td colspan="12" class="empty">找不到符合條件的品項，請調整搜尋或篩選條件。</td></tr>';return}
 tbody.innerHTML=filtered.map(i=>{
  const s=stock(i),m=safe(i),stt=status(i),ord=order(i);
  const cls=stt==='low'||stt==='zero'?'low':stt==='unknown'?'neutral':'ok';
  const label=stt==='zero'?'庫存為零':stt==='low'?'低於安全庫存':stt==='ok'?'達安全庫存':'未設定數量';
  const sup=(i['供應商選項']||[]).map(x=>[x['供應商'],x['單價NT(未稅)']?`NT$ ${x['單價NT(未稅)']}`:'',x['交期']].filter(Boolean).join(' · '));
  if(val(i,'供應商','單價NT(未稅)','交期'))sup.unshift([val(i,'供應商'),val(i,'單價NT(未稅)')?'NT$ '+val(i,'單價NT(未稅)'):'',val(i,'交期')].filter(Boolean).join(' · '));
  return `<tr><td>${esc(i['分類'])}</td><td><strong>${esc(val(i,'品名','名稱')||'—')}</strong></td><td>${esc(val(i,'廠牌')||'—')}</td><td>${esc(val(i,'型號','型號/規格','型號／規格')||'—')}</td><td>${esc([val(i,'線別'),val(i,'設備名稱')].filter(Boolean).join(' / ')||'—')}</td><td>${esc(val(i,'位置')||'—')}</td><td class="num">${fmt(m)}</td><td class="num">${fmt(s)}</td><td><span class="pill ${cls}">${label}</span></td><td class="num">${ord===null?'—':ord>0?`<span class="suggest">${fmt(ord)}</span>`:'—'}</td><td>${esc([...new Set(sup)].join('；')||'—')}</td><td>${esc(val(i,'備註')||'—')}</td></tr>`
 }).join('');
}
function stats(){document.querySelector('#total').textContent=ITEMS.length.toLocaleString('zh-TW');document.querySelector('#low').textContent=ITEMS.filter(i=>status(i)==='low').length.toLocaleString('zh-TW');document.querySelector('#zero').textContent=ITEMS.filter(i=>status(i)==='zero').length.toLocaleString('zh-TW');document.querySelector('#cats').textContent=categories.length}
['q','category','stockFilter','onlyBuy'].forEach(id=>document.getElementById(id).addEventListener(id==='q'?'input':'change',render));stats();render();
</script></body></html>
